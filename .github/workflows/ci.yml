name: CI

on:
  push:
    branches: [master, local]
  pull_request:
    branches: [master]

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No .env exists in CI. This passes only because environment
      # resolution is lazy — see src/lib/env.ts.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
